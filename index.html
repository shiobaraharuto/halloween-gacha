<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17151c"><title>ハロウィン彼氏ガチャ</title><style>*{box-sizing:border-box}body{margin:0;background:#100e14;color:#f3edf6;font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}.app{max-width:440px;min-height:100dvh;margin:auto;background:#17151c;padding:32px 20px}header{text-align:center;margin:15px 0 28px}.eyebrow{font-size:11px;letter-spacing:2px;color:#b8a5c5}h1{font-size:24px;margin:10px 0}header p,.muted{color:#b8a5c5;font-size:13px}.tabs{display:flex;background:#25212c;border-radius:12px;padding:4px;gap:4px;margin-bottom:20px}.tabs button{flex:1;background:transparent;border:0;color:#b8a5c5;padding:12px;border-radius:9px;font-weight:700}.tabs button.active{background:#4c3c59;color:#fff}.panel{background:#25212c;border:1px solid #54475e;border-radius:18px;min-height:270px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px 20px;gap:13px;animation:appear .35s ease}.emoji{font-size:52px}.name{font-size:21px;font-weight:700}.quote{font-size:15px;color:#cbbfd1;line-height:1.8}.primary{background:#9f83b4;color:#160f1b;border:0;border-radius:12px;width:100%;font-size:17px;font-weight:800;padding:17px;margin-top:18px;cursor:pointer}.secondary{border:1px solid #6e5a7d;background:#342d3b;color:#f3edf6;padding:11px 16px;border-radius:10px;cursor:pointer}.stats{display:flex;justify-content:space-between;color:#b8a5c5;font-size:12px;margin-top:15px}.list{display:grid;gap:10px}.item{background:#25212c;border:0;border-radius:12px;padding:16px;display:flex;align-items:center;gap:16px;text-align:left;color:#fff;width:100%;cursor:pointer}.item:disabled{opacity:.65;cursor:default}.item .icon{font-size:27px}.item small{display:block;color:#b8a5c5;margin-top:5px}.hidden{display:none!important}audio{width:100%;max-width:310px}.hint{font-size:12px;color:#b8a5c5}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}@keyframes appear{from{opacity:.2;transform:scale(.94)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.panel{animation:none}}</style></head><body><main class="app"><header><div class="eyebrow">HALLOWEEN 2026</div><h1>ハロウィン彼氏ガチャ</h1><p>今夜の彼氏は、だあれ？</p></header><nav class="tabs"><button id="drawTab" class="active">ガチャ</button><button id="bookTab">図鑑 <span id="progress">0/5</span></button></nav><section id="drawView"><div id="panel" class="panel"><div class="emoji">🎁</div><div class="name">誰が出るかはお楽しみ</div><div class="muted">タップして限定ボイスをゲット</div></div><button id="drawBtn" class="primary">ガチャを引く</button><div class="stats"><span>無料・何度でも</span><span id="count">0回引いた</span></div></section><section id="bookView" class="hidden"><p class="muted">ボイス図鑑　<span id="progress2">0/5</span></p><div id="list" class="list"></div></section></main><script>const characters=[{name:'吸血鬼彼氏',emoji:'🦇',line:'お前の血を吸わせろ',audio:'audio/01-vampire.mp3'},{name:'悪魔彼氏',emoji:'😈',line:'俺と契約する？',audio:'audio/02-demon.mp3'},{name:'狼男彼氏',emoji:'🐺',line:'……あまり近づくな',audio:'audio/03-wolf.mp3'},{name:'おばけ彼氏',emoji:'👻',line:'はは、びっくりした？',audio:'audio/04-ghost.mp3'},{name:'黒猫彼氏',emoji:'🐈‍⬛',line:'何見てんだよ',audio:'audio/05-cat.mp3'}];const key='haruto-halloween-gacha-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{seen:[],count:0}}catch{data={seen:[],count:0}}if(!Array.isArray(data.seen))data.seen=[];if(!Number.isFinite(data.count))data.count=0;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{}}function update(){ $('progress').textContent=`${data.seen.length}/5`;$('progress2').textContent=`${data.seen.length}/5`;$('count').textContent=`${data.count}回引いた`; $('list').replaceChildren();characters.forEach((c,i)=>{const b=document.createElement('button');b.className='item';b.disabled=!data.seen.includes(i);const icon=document.createElement('span');icon.className='icon';icon.textContent=b.disabled?'🔒':c.emoji;const t=document.createElement('span');t.textContent=b.disabled?'？？？':c.name;const sm=document.createElement('small');sm.textContent=b.disabled?'未獲得':'獲得済み・タップして聴く';t.append(sm);b.append(icon,t);b.addEventListener('click',()=>{show(i);tab('draw')});$('list').append(b)})}function tab(which){$('drawView').classList.toggle('hidden',which!=='draw');$('bookView').classList.toggle('hidden',which!=='book');$('drawTab').classList.toggle('active',which==='draw');$('bookTab').classList.toggle('active',which==='book')}function show(i){const c=characters[i];const p=$('panel');p.replaceChildren();const em=document.createElement('div');em.className='emoji';em.textContent=c.emoji;const name=document.createElement('div');name.className='name';name.textContent=c.name;const quote=document.createElement('div');quote.className='quote';quote.textContent='「'+c.line+'」';const player=document.createElement('audio');player.controls=true;player.preload='none';player.src=c.audio;const hint=document.createElement('div');hint.className='hint';hint.textContent='音声が未配置の場合は再生できません';const share=document.createElement('button');share.className='secondary';share.textContent='Xでシェア';share.onclick=()=>window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent('🎃 ハロウィン彼氏ガチャで「'+c.name+'」が出た！ #ハロウィン彼氏ガチャ')+'&url='+encodeURIComponent(location.href),'_blank','noopener,noreferrer');p.append(em,name,quote,player,hint,share);$('drawBtn').textContent='もう一度引く'}$('drawBtn').onclick=()=>{let i;if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);i=Math.floor(a[0]/4294967296*5)}else{i=Math.floor(Math.random()*5)}data.count++;if(!data.seen.includes(i))data.seen.push(i);save();show(i);update()};$('drawTab').onclick=()=>tab('draw');$('bookTab').onclick=()=>tab('book');update();</script></body></html>
